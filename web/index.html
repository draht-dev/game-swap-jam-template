<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Swap Jam</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: #0a0a0e;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- Vendored from macroquad 0.4.16, see README.md -->
    <script src="mq_js_bundle.js"></script>
    <script>load("game_swap_jam_template.wasm");</script>
    <script>
        // Nur für das Eingabe-Gate (index.html?gate-input): hält "Pfeil rechts" gedrückt,
        // bis das Spiel "GATE-INPUT ok" loggt, und lässt dann los.
        // Bewusst an echte Frames (requestAnimationFrame) gekoppelt statt an Timer:
        // headless Chrome mit --virtual-time-budget lässt Timer schneller laufen als
        // Frames gerendert werden. Ein fester Timer (früher 1500 ms + 800 ms) konnte
        // auf langsamen CI-Runnern drücken und loslassen, bevor die Spielschleife lief.
        // Reagiert das Spiel nicht, kommt nie "GATE-INPUT ok" und das Gate bleibt rot.
        if (new URLSearchParams(location.search).has("gate-input")) {
            const canvas = document.getElementById("glcanvas");
            const key = (type, repeat) => canvas.dispatchEvent(new KeyboardEvent(type,
                { code: "ArrowRight", key: "ArrowRight", bubbles: true, repeat }));
            let ok = false;
            const log = console.log;
            console.log = function (...args) {
                if (String(args[0]).includes("GATE-INPUT ok")) ok = true;
                return log.apply(this, args);
            };
            let frames = 0;
            const tick = () => {
                if (ok) { key("keyup", false); return; }
                // Alle 10 Frames erneut drücken, falls der erste Druck vor dem
                // Start der Spielschleife (Key-Handler noch nicht gesetzt) kam.
                if (frames % 10 === 0) key("keydown", frames > 0);
                frames++;
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }
    </script>
</body>
</html>
