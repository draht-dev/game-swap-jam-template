<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Swap Jam</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: #0a0a0e;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- Vendored from macroquad 0.4.16, see README.md -->
    <script src="mq_js_bundle.js"></script>
    <script>load("game_swap_jam_template.wasm");</script>
    <script>
        // Nur für das Eingabe-Gate (index.html?gate-input): drückt kurz "Pfeil rechts".
        if (new URLSearchParams(location.search).has("gate-input")) {
            const canvas = document.getElementById("glcanvas");
            const key = (type) => canvas.dispatchEvent(
                new KeyboardEvent(type, { code: "ArrowRight", key: "ArrowRight", bubbles: true }));
            setTimeout(() => { key("keydown"); setTimeout(() => key("keyup"), 800); }, 1500);
        }
    </script>
</body>
</html>
